[project]
name = "lblm"
version = "0.1.0"
description = "Local body-language conversation pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.2,<9",
    "pydantic>=2.13.5",
    "huggingface-hub>=0.34,<1",
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
camera = ["opencv-contrib-python>=4.11,<6"]
pose = ["mediapipe==0.10.35"]
llm = ["llama-cpp-python>=0.3.35,<0.4"]
motiongpt = [
    "torch>=2.6,<3",
    "transformers>=4.45,<5",
    "sentencepiece>=0.2,<0.3",
    "scipy>=1.15,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "mypy>=1.15,<3", "ruff>=0.15,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["models: opt-in real model downloads and native inference"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100
